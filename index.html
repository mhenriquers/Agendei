<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agendei</title>
  <meta name="description" content="Checklist simples que funciona offline.">

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#fbf6ee">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Agendei">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="./styles.css">
  <script src="./settings.js" defer></script>
  <script src="./app.js" defer></script>
</head>

<body>
  <div id="app-bg" class="app-bg" aria-hidden="true" hidden></div>

  <main class="app">
    <header class="app-header">
      <img id="avatar" class="avatar" alt="Foto do perfil" width="48" height="48" hidden>
      <div class="app-title">
        <h1>Olá Thaynara!</h1>
        <p id="counter" class="counter" aria-live="polite">0 pendentes</p>
      </div>
      <button type="button" id="open-settings" class="icon-btn" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
        </svg>
        <span class="sr-only">Personalizar</span>
      </button>
    </header>

    <form id="add-form" class="add-form" autocomplete="off">
      <label for="new-item" class="sr-only">Novo item</label>
      <input id="new-item" name="text" type="text" maxlength="200" required placeholder="O que precisa fazer?"
        enterkeyhint="done">
      <button type="submit" class="btn btn-primary">Adicionar</button>
    </form>

    <ul id="list" class="list" aria-label="Itens da checklist"></ul>

    <p id="empty-state" class="empty-state">Nenhum item ainda.</p>

    <footer class="app-footer">
      <button type="button" id="clear-done" class="btn btn-ghost" disabled>Limpar concluídos</button>
    </footer>

    <noscript>
      <p class="noscript">Este app precisa de JavaScript ativado para funcionar.</p>
    </noscript>
  </main>

  <div id="update-banner" class="update-banner" role="status" hidden>
    <span>Nova versão disponível.</span>
    <button type="button" id="update-button" class="btn btn-primary">Atualizar</button>
  </div>

  <dialog id="settings" class="panel" aria-labelledby="settings-title">
    <form method="dialog" class="panel-form">
      <h2 id="settings-title">Personalizar</h2>

      <fieldset>
        <legend>Foto do perfil</legend>
        <p class="hint">Aparece no topo do app e na aba do navegador. O ícone do app instalado não muda: ele é fixo no site.</p>
        <div class="panel-row">
          <label class="btn btn-ghost file-btn">
            Escolher foto
            <input type="file" id="avatar-file" accept="image/*" class="sr-only">
          </label>
          <button type="button" id="avatar-remove" class="btn btn-ghost">Remover</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Plano de fundo</legend>
        <div class="panel-row">
          <label class="choice"><input type="radio" name="bg-type" value="default"> Padrão</label>
          <label class="choice"><input type="radio" name="bg-type" value="color"> Cor sólida</label>
          <label class="choice"><input type="radio" name="bg-type" value="photo"> Foto</label>
        </div>

        <div id="bg-color-options" class="panel-sub" hidden>
          <div class="swatches">
            <button type="button" class="swatch" data-color="#fbf6ee" style="background:#fbf6ee"><span class="sr-only">Areia (padrão)</span></button>
            <button type="button" class="swatch" data-color="#f8e1e4" style="background:#f8e1e4"><span class="sr-only">Rosa</span></button>
            <button type="button" class="swatch" data-color="#fbf0c9" style="background:#fbf0c9"><span class="sr-only">Amarelo-manteiga</span></button>
            <button type="button" class="swatch" data-color="#dcebf3" style="background:#dcebf3"><span class="sr-only">Azul-céu</span></button>
            <button type="button" class="swatch" data-color="#e3f1e8" style="background:#e3f1e8"><span class="sr-only">Menta</span></button>
            <button type="button" class="swatch" data-color="#3d3431" style="background:#3d3431"><span class="sr-only">Chocolate</span></button>
          </div>
          <label class="color-pick">Outra cor <input type="color" id="bg-color" value="#fbf6ee"></label>
        </div>

        <div id="bg-photo-options" class="panel-sub" hidden>
          <label class="btn btn-ghost file-btn">
            Escolher foto
            <input type="file" id="bg-file" accept="image/*" class="sr-only">
          </label>
          <p id="bg-photo-hint" class="hint">Escolha uma foto para usar como fundo.</p>
          <label for="bg-blur" class="range-label">Desfoque: <output id="bg-blur-value" for="bg-blur">0</output> px</label>
          <input type="range" id="bg-blur" min="0" max="20" step="1" value="0">
        </div>
      </fieldset>

      <div class="panel-actions">
        <button type="submit" class="btn btn-primary">Fechar</button>
      </div>
    </form>
  </dialog>

  <template id="item-template">
    <li class="item">
      <label class="item-check">
        <input type="checkbox" class="item-toggle">
        <span class="item-body">
          <span class="item-text"></span>
          <span class="item-meta" hidden></span>
        </span>
      </label>
      <div class="item-actions">
        <button type="button" class="icon-btn item-edit" data-action="edit">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" />
          </svg>
          <span class="sr-only">Editar</span>
        </button>
        <button type="button" class="icon-btn item-delete" data-action="delete">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" />
          </svg>
          <span class="sr-only">Excluir</span>
        </button>
      </div>
    </li>
  </template>
</body>

</html>
